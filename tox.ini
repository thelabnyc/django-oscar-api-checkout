[tox]
isolated_build = True
toxworkdir={env:TOX_WORK_DIR:.tox}
envlist =
    py{313,314,315}-django{520,600,610}-drf{318}-oscar{42}

[testenv]
runner = uv-venv-runner
dependency_groups = dev
deps =
    django520: django>=5.2,<5.3
    django600: django>=6.0,<6.1
    django610: django>=6.1,<6.2
    drf318: djangorestframework>=3.18,<3.19
    oscar42: django-oscar>=4.2,<4.3
setenv =
    PYTHONWARNINGS = d
commands =
    mypy oscarapicheckout sandbox
    coverage erase
    coverage run \
        {toxinidir}/manage.py test \
            oscarapicheckout \
            -v 2 \
            --buffer \
            --noinput
    - coverage report
